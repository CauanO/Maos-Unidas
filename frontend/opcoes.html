<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Opções Mãos Unidas</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../assets/css/style.css">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="text-center mb-4">
                <button id="btn-doacoes" class="btn btn-success w-25 btn-lg px-5" role="button">
                    PERFIL
                </button>
            </div>
        </div>
        <section
            class="d-flex justify-content-center align-items-start min-vh-100 p-3"
        >
            <div
                class="card rounded-4 shadow-sm p-4"
                style="max-width: 800px; width: 100%"
            >
                <img
                    src="../frontend/assets/img/mãos_unidas_logo.png"
                    alt="Logo Mãos Unidas"
                    class="mx-auto d-block mb-4"
                    style="width: 80px"
                />
                <h2 class="fw-bold text-center mb-3" style="color: #222">
                    Mãos Unidas
                </h2>
                <p class="text-secondary fs-6 text-center mb-4">
                    Mãos Unidas é uma rede social solidária que conecta ONGs a
                    pessoas dispostas a ajudar. Nosso objetivo é ampliar o
                    alcance das organizações, facilitar doações e fortalecer o
                    impacto social. Unimos quem faz o bem a quem quer
                    transformar o mundo junto.
                </p>
                <a
                    href="ranking.html"
                    class="btn btn-success w-100 rounded-3 fw-bold text-uppercase mb-3"
                    role="button"
                    >Doações</a
                >
                <a
                    href="#"
                    class="btn btn-success w-100 rounded-3 fw-bold text-uppercase mb-3"
                    role="button"
                    >Salvas</a
                >
                <a
                    href="calendario.html"
                    class="btn btn-success w-100 rounded-3 fw-bold text-uppercase"
                    role="button"
                    >Calendário</a
                >
            </div>
        </section>
    </body>
</html>

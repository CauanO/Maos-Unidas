<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postagem Vidas em Foco</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 20px;
    }

    .container {
    max-width: 400px;
    margin: auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    }

    .logo {
    width: 40px;
    }
    .notification {
    width: 15px;
    height: 15px;
    background-color: red;
    border-radius: 50%;
    }

    .post {
    border-top: 1px solid #ccc;
    }

    .post-header {
    display: flex;
    align-items: center;
    padding: 10px;
    }

    .profile-pic {
    width: 40px;
    border-radius: 50%;
    margin-right: 10px;
    }

    .post-info h3 {
    margin: 0;
    }

    .post-info span {
    font-size: 12px;
    color: gray;
    }

    .more-options {
    margin-left: auto;
    font-size: 18px;
    cursor: pointer;
    }

    .post-image {
    width: 100%;
    height: auto;
    }

    .post-text {
    padding: 10px;
    }

    .download-btn {
    display: inline-block;
    margin-top: 10px;
    color: blue;
    text-decoration: none;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5UKw7RvpWVOywWdNFUzwLHH2fPZiEB-tg7g&s" alt="Logo" class="logo">
      <div class="notification"></div>
    </div>

    <div class="post">
      <div class="post-header">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5UKw7RvpWVOywWdNFUzwLHH2fPZiEB-tg7g&s" alt="Vidas em Foco" class="profile-pic">
        <div class="post-info">
          <h3>Vidas em foco</h3>
          <span>22.965 Seguidores</span>
        </div>
        <div class="more-options">•••</div>
      </div>

      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5UKw7RvpWVOywWdNFUzwLHH2fPZiEB-tg7g&s" alt="Ação beneficente" class="post-image">

      <div class="post-text">
        <p><strong>Vidas em foco</strong> realizou uma ação beneficente no da pituba, com o objetivo de levar alegria e recreação para cerca de 100 crianças da localidade.</p>
        <a href="#" class="download-btn">⬇️ Download</a>
      </div>
    </div>
  </div>
</body>
</html>
